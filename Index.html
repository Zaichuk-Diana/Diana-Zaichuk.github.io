<title>Катерина Катаровска</title>
<meta name="description" content="Marketing &amp; visual designer in Bratislava. 6+ years of marketing design for IT, SaaS, fintech and EdTech.">

<style>
/* Layout: Tilework-style rounded bento (2fr 1fr 1fr) under a floating pill nav, painted in PPG colours. */
:root{
  --bg:#E9EBEE; --card:#FBFBFC; --fg:#1C1D1F; --muted:#62676F; --faint:#9AA0A8; --line:#D3D7DC;
  --btn:#1C1D1F; --btn-fg:#FBFBFC;
  /* PPG paints — identical in both themes */
  --blue-smoke:#A9BFC5; --mr-robin:#DFE9E1; --seaweed:#6A6F52; --rescue:#D9613E; --shepherd:#E6CABB; --inky:#404854;
  --ink-dark:#1C1D1F; --ink-light:#F6F4F1;
  --f-sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-display:"Inter Tight","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --t-xs:12px; --t-s:15px; --t-m:17px; --t-l:clamp(22px,2vw,30px); --t-xl:clamp(32px,3.4vw,52px); --t-hero:clamp(40px,5.2vw,80px);
  --r:32px; --gap:18px; --max:1320px;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --card:#202226; --fg:#EEF0F2; --muted:#9EA4AC; --faint:#6E747C; --line:#33363B; --btn:#EEF0F2; --btn-fg:#141517; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141517; --card:#202226; --fg:#EEF0F2; --muted:#9EA4AC; --faint:#6E747C; --line:#33363B; --btn:#EEF0F2; --btn-fg:#141517; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:var(--t-m);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4,.big,.fig,.case-title,.wordmark,.case-sub,.q .pull,.elist a,.t-quote blockquote{font-family:var(--f-display)}
:focus-visible{outline:2px solid var(--rescue);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.label{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.09em;text-transform:uppercase;margin:0;line-height:1.3}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 var(--t-s)/1 var(--f-sans);text-decoration:none;background:var(--btn);color:var(--btn-fg);border:1px solid var(--btn);border-radius:999px;padding:14px 22px;cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color .2s ease,border-color .2s ease}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--rescue);border-color:var(--rescue);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn .ar{font-size:15px;line-height:1}

/* Pill nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding-block:16px 6px}
.pill{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;text-decoration:none;white-space:nowrap}
.gdot{width:9px;height:9px;border-radius:50%;background:#7FC79A;flex:none}
.links-c{display:flex;gap:28px}
.links-c a{text-decoration:none;color:var(--muted)}
.links-c a:hover{color:var(--fg)}
.right{display:flex;align-items:center;gap:8px}
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:999px;background:var(--fg);transition:transform 240ms var(--ease-out)}
.lang[data-active="ua"]::before{transform:translateX(100%)}
.lang button{position:relative;z-index:1;font:500 var(--t-xs)/1 var(--f-mono);letter-spacing:.05em;background:transparent;color:var(--muted);border:0;border-radius:999px;padding:8px 11px;cursor:pointer;transition:color 200ms ease}
.lang button[aria-pressed="true"]{color:var(--bg)}
@media (max-width:860px){.links-c{display:none}}
@media (max-width:440px){.right .btn{display:none}.pill{padding-right:8px}}

/* Bento */
.bento{display:grid;gap:var(--gap);margin-top:16px;
  grid-template-columns:2fr 1fr 1fr;
  grid-template-rows:minmax(310px,auto) minmax(310px,auto) minmax(300px,auto) minmax(300px,auto);
  grid-template-areas:"hero photo status" "hero photo exp" "feat tools quote" "clients else talk"}
.tile{border-radius:var(--r);padding:clamp(24px,2.4vw,38px);display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden;color:var(--ink-dark);text-decoration:none}
.tile.on-dark{color:var(--ink-light)}
.tile .push{margin-top:auto}

.t-hero{grid-area:hero;background:var(--card);color:var(--fg)}
.who{display:flex;align-items:center;gap:14px;color:var(--muted)}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none}
h1{font-size:var(--t-hero);font-weight:500;letter-spacing:-.05em;line-height:1;margin:clamp(36px,5vw,64px) 0 0;max-width:13ch;text-wrap:balance}
html[lang="uk"] h1{max-width:16ch;font-size:clamp(36px,4.6vw,70px)}
.t-hero .sub{color:var(--muted);margin:22px 0 0;max-width:50ch;font-size:var(--t-m);line-height:1.6}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

.t-photo{grid-area:photo;padding:0;background:var(--shepherd)}
.t-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;min-height:420px}

.t-status{grid-area:status;background:var(--mr-robin)}
.t-status .label{display:flex;align-items:center;gap:10px}
.pulse{width:12px;height:12px;border-radius:50%;background:#3E9B5F;flex:none;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,155,95,.45)}70%{box-shadow:0 0 0 9px rgba(62,155,95,0)}100%{box-shadow:0 0 0 0 rgba(62,155,95,0)}}
.tile h3{font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:0;font-size:var(--t-l);text-wrap:balance}
.tile .p{margin:12px 0 0;font-size:var(--t-s);line-height:1.5}

.t-exp{grid-area:exp;background:var(--blue-smoke)}
.big{font-size:clamp(56px,5.6vw,88px);font-weight:500;letter-spacing:-.06em;line-height:.95;white-space:nowrap}
html[lang="uk"] .big{font-size:clamp(44px,4.4vw,70px)}

.t-feat{grid-area:feat;background:var(--seaweed) url("img/honna.jpg") center 28%/cover no-repeat;min-height:300px}
.t-feat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,32,26,0) 30%,rgba(28,32,26,.78) 100%);pointer-events:none}
.t-feat>*{position:relative}
.t-feat .roundbtn{position:absolute}
.t-feat .ghost-word{position:absolute;right:-.04em;top:-.12em;font-size:clamp(120px,15vw,230px);font-weight:500;letter-spacing:-.07em;line-height:1;color:rgba(255,255,255,.08);pointer-events:none;white-space:nowrap}
.t-feat .label{opacity:.7}
.t-feat h3{font-size:var(--t-xl);margin-top:8px}
.t-feat .p{opacity:.8;max-width:40ch}
.roundbtn{position:absolute;right:clamp(20px,2.2vw,34px);bottom:clamp(20px,2.2vw,34px);width:60px;height:60px;border-radius:50%;background:#fff;color:var(--ink-dark);display:grid;place-items:center;font-size:22px;transition:transform 300ms var(--ease-out)}

.t-tools{grid-area:tools;background:var(--shepherd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{background:rgba(255,255,255,.62);border-radius:999px;padding:9px 16px;font-size:var(--t-s)}

.t-quote{grid-area:quote;background:var(--inky)}
.qmark{font-size:56px;line-height:.6;color:var(--rescue);font-weight:600;height:30px;margin:0}
.t-quote blockquote{margin:22px 0 0;font-size:clamp(18px,1.5vw,22px);line-height:1.45;letter-spacing:-.01em}
.t-quote .by{color:rgba(246,244,241,.62);font-size:var(--t-s)}

.t-clients{grid-area:clients;background:var(--card);color:var(--fg)}
.t-clients .label{color:var(--muted)}
.inds li{background:var(--bg);color:var(--fg)}

.t-else{grid-area:else;background:var(--blue-smoke)}
.elist{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px}
.elist a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-decoration:none;font-size:clamp(24px,2.2vw,32px);font-weight:500;letter-spacing:-.03em;padding-block:6px}
.elist a small{white-space:nowrap;font-size:var(--t-xs);font-family:var(--f-mono);letter-spacing:.04em;font-weight:400;opacity:.7;margin-left:auto;margin-right:12px}
.elist a .ar{font-size:20px}


.t-talk{grid-area:talk;background:var(--rescue);color:#fff}
.t-talk .label{opacity:.85}
.t-talk{container-type:inline-size}
.t-talk h3{font-size:clamp(34px,3.3vw,52px);font-size:clamp(32px,17cqi,64px);letter-spacing:-.045em;line-height:1;overflow-wrap:break-word;hyphens:manual}
html[lang="uk"] .t-talk h3{font-size:clamp(30px,2.7vw,44px);font-size:clamp(28px,15cqi,58px)}
.t-talk .mail{display:block;margin-top:14px;font-size:var(--t-s);overflow-wrap:normal;word-break:normal}


@media (max-width:1100px){
  .bento{grid-template-columns:1fr 1fr;grid-template-rows:none;
    grid-template-areas:"hero hero" "photo status" "photo exp" "feat feat" "tools quote" "clients clients" "else talk"}
  .tile{min-height:260px}
  .t-hero{min-height:0}
}
@media (max-width:640px){
  .bento{grid-template-columns:1fr;grid-template-areas:"hero" "photo" "status" "exp" "feat" "tools" "quote" "clients" "else" "talk"}
  .t-photo img{min-height:0;aspect-ratio:4/5}
  :root{--r:26px}
}
</body></html>
